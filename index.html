<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f0f0; }
        .calculator { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        #display { width: 100%; height: 50px; font-size: 24px; text-align: right; margin-bottom: 10px; padding: 5px; box-sizing: border-box; }
        .buttons { display: grid; grid-template-columns: repeat(4, 60px); gap: 5px; }
        button { height: 60px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; background: #e0e0e0; }
        button:hover { background: #d0d0d0; }
        button.operator { background: #ff9500; color: white; }
        button.operator:hover { background: #e08600; }
        button.clear { background: #ff3b30; color: white; }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="append('/')" class="operator">/</button>
            <button onclick="append('*')" class="operator">*</button>
            <button onclick="append('-')" class="operator">-</button>
            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button onclick="append('+')" class="operator">+</button>
            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button onclick="calculate()" class="operator">=</button>
            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button onclick="append('0')">0</button>
            <button onclick="append('.')">.</button>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');
        function append(val) { display.value += val; }
        function clearDisplay() { display.value = ''; }
        function calculate() {
            try { display.value = eval(display.value); }
            catch { display.value = 'Error'; }
        }
    </script>
</body>
</html>
